<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table styling</title>
    <style>
        th,
        td {
            border: 2px solid black;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
            text-align: center;
        }

        th {
            background-color: rgb(6, 180, 238);
            color: rgb(241, 6, 6);
            text-decoration: underline;
        }

        /* used to highlight the tr */
        tr:hover {
            background-color: lightcoral;
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Roll no</th>
            <th>Reg no</th>
            <th>Branch</th>
        </tr>
        <tr>
            <td>Rohit</td>
            <td>0011</td>
            <td>00111</td>
            <td>CSE</td>
        </tr>
        <tr>
            <td>Rohan</td>
            <td>0022</td>
            <td>00333</td>
            <td>ECE</td>
        </tr>
        <tr>
            <td>Gyan</td>
            <td>0033</td>
            <td>00444</td>
            <td>CSE</td>
        </tr>
        <tr>
            <td>Geeta</td>
            <td>0044</td>
            <td>00555</td>
            <td>CSE</td>
        </tr>
        <tr>
            <td>Nihal</td>
            <td>0055</td>
            <td>00666</td>
            <td>EEE</td>
        </tr>
    </table>
</body>

</html>
