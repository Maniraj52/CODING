<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Checkbox & Radio</title>
</head>

<body>
    <fieldset>
        <!-- Checkbox -->
        <label for="Select your Hobbies">Choose your Hobbies</label><br>
        <input type="Checkbox" id="hobby1" name="favourite_hobbies" value="Singing">
        <label for="hobby1">Singing</label><br>
        <input type="Checkbox" id="hobby2" name="favourite_hobbies" value="Dancing">
        <label for="hobby2">Dancing</label><br>
        <input type="Checkbox" id="hobby3" name="favourite_hobbies" value="Music">
        <label for="hobby3">Music</label><br>
        <input type="Checkbox" id="hobby4" name="favourite_hobbies" value="Travelling">
        <label for="hobby4">Travelling</label><br>
        <input type="submit" value="submit"><br><br>
        <!-- Radio -->
        <label for="Select your fav_language">Choose your fav_language</label><br>
        <input type="radio" id="language1" name="fav_language" value="C">
        <label for="language1">C</label> <br>
        <input type="radio" id="language2" name="fav_language" value="C++">
        <label for="language2">C++</label> <br>
        <input type="radio" id="language3" name="fav_language" value="JAVA">
        <label for="language3">JAVA</label><br>
        <input type="radio" id="language4" name="fav_language" value="PYTHON">
        <label for="language4">PYTHON</label><br>
        <input type="submit" value="submit"><br><br>
    </fieldset>
</body>

</html>
