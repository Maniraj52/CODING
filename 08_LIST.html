<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Ordered & Unordered</title>
</head>
<body>
    <!-- Ordered List -->
    <ol type="i" title="fruits name">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Grapes</li>
        <li>Papaya</li>
    </ol>
    <hr>
    <!-- Unordered List -->
    <ul type="" title="Vegetables Name">
        <li>Tomato</li>
        <li>Potato</li>
        <li>Carrot</li>
        <li>Onion</li>
        <li>Ginger</li>
    </ul>
    <hr>
</body>
</html>
